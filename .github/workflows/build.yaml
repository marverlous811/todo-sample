name: Build Realtime server

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build"
        required: true
        default: "latest"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MODULE: data-sample
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build release
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    env:
      RUST_BACKTRACE: 1
    strategy:
      matrix:
        build:
          - linux musl x64
          - linux musl aarch64
        include:
          - build: linux musl x64
            os: ubuntu-latest
            rust: stable
            target: x86_64-unknown-linux-musl
            cross: false
          - build: linux musl aarch64
            os: ubuntu-latest
            rust: stable
            target: aarch64-unknown-linux-musl
            cross: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dev-tools
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get install -y --no-install-recommends pkg-config musl-dev musl-tools libssl-dev

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ matrix.rust }}
          profile: minimal
          override: true
          target: ${{ matrix.target }}

      - name: Build relay-node
        uses: actions-rs/cargo@v1
        with:
          use-cross: ${{ matrix.cross }}
          command: build
          args: --verbose --release --target ${{ matrix.target }}

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MODULE }}-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ env.MODULE }}

  docker-build:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.MODULE }}-x86_64-unknown-linux-gnu
          path: release/${{ env.MODULE }}-x86_64-unknown-linux-gnu

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.MODULE }}-aarch64-unknown-linux-gnu
          path: release/${{ env.MODULE }}-aarch64-unknown-linux-gnu

      - name: Login to Dockerhub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKER_HUB_REPO }}

      - name: Build and push
        uses: docker/build-push-action@v2
        with:
          platforms: linux/amd64,linux/arm64
          context: .
          push: true
          tags: ${{ vars.DOCKER_HUB_REPO }}:${{ inputs.VERSION }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APPLICATION=${{ env.MODULE }}
